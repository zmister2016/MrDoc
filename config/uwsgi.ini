[uwsgi]
master = true
processes = 4
chdir = /app/MrDoc
wsgi-file= /app/MrDoc/MrDoc/wsgi.py
http-socket = 0.0.0.0:10086
logto = /app/MrDoc/log/uwsgi_log.log
log-maxsize = 3000000
chmod-socket = 660
vacuum = true
master = true
enable-threads = true
max-requests = 1000
buffer-size = 65536
http-timeout = 300
socket-timeout = 300
# mercy 必须大于最长请求耗时，否则 max-requests / 优雅重载会腰斩请求
reload-mercy = 600
worker-reload-mercy = 600